<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <style>
    text { font-family: sans-serif; fill: #202124; }
    .title { font-size: 20px; font-weight: 600; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
    .axis { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); }
    .point { fill: #2878b5; stroke: white; stroke-width: 1.5; }
    .svd { stroke: #d1495b; stroke-width: 4; }
    .pca { stroke: #2a9d65; stroke-width: 4; }
    .mean { stroke: #111; stroke-width: 3; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="430" fill="white"/>
  <line x1="500" y1="35" x2="500" y2="405" stroke="#ddd" stroke-width="2"/>

  <text x="250" y="30" text-anchor="middle" class="title">SVD de rango 1 sin centrar</text>
  <line x1="55" y1="370" x2="465" y2="370" class="axis"/>
  <line x1="65" y1="382" x2="65" y2="55" class="axis"/>
  <line x1="65" y1="370" x2="448" y2="103" class="svd"/>
  <circle cx="65" cy="370" r="5" fill="#111"/>
  <text x="72" y="390" class="small">0</text>
  <text x="285" y="310" class="label" fill="#d1495b">recta obligada a pasar por 0</text>

  <g>
    <circle cx="210" cy="260" r="7" class="point"/><circle cx="235" cy="246" r="7" class="point"/>
    <circle cx="258" cy="238" r="7" class="point"/><circle cx="280" cy="215" r="7" class="point"/>
    <circle cx="305" cy="220" r="7" class="point"/><circle cx="325" cy="188" r="7" class="point"/>
    <circle cx="348" cy="181" r="7" class="point"/><circle cx="372" cy="158" r="7" class="point"/>
    <circle cx="395" cy="160" r="7" class="point"/><circle cx="420" cy="133" r="7" class="point"/>
  </g>

  <text x="750" y="30" text-anchor="middle" class="title">PCA: datos centrados</text>
  <line x1="535" y1="370" x2="955" y2="370" class="axis"/>
  <line x1="545" y1="382" x2="545" y2="55" class="axis"/>
  <line x1="650" y1="285" x2="935" y2="115" class="pca"/>
  <circle cx="545" cy="370" r="5" fill="#111"/>
  <text x="552" y="390" class="small">0</text>

  <g>
    <circle cx="690" cy="260" r="7" class="point"/><circle cx="715" cy="246" r="7" class="point"/>
    <circle cx="738" cy="238" r="7" class="point"/><circle cx="760" cy="215" r="7" class="point"/>
    <circle cx="785" cy="220" r="7" class="point"/><circle cx="805" cy="188" r="7" class="point"/>
    <circle cx="828" cy="181" r="7" class="point"/><circle cx="852" cy="158" r="7" class="point"/>
    <circle cx="875" cy="160" r="7" class="point"/><circle cx="900" cy="133" r="7" class="point"/>
  </g>

  <line x1="790" y1="194" x2="806" y2="210" class="mean"/>
  <line x1="806" y1="194" x2="790" y2="210" class="mean"/>
  <text x="810" y="232" class="label">media</text>
  <text x="650" y="325" class="label" fill="#2a9d65">subespacio afín: media + dirección principal</text>
</svg>
