<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">Proyección ortogonal sobre un subespacio</title>
  <desc id="desc">El punto p está en W y el residuo x menos p pertenece al complemento ortogonal.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14578c"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be2d37"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17202a}.math{font-family:"Times New Roman",serif;font-style:italic}</style>
  </defs>
  <rect width="900" height="450" fill="white"/>
  <line x1="65" y1="300" x2="835" y2="300" stroke="#14578c" stroke-width="6"/>
  <text x="810" y="280" font-size="29" fill="#14578c" class="math">W</text>
  <circle cx="130" cy="300" r="5" fill="#17202a"/><text x="115" y="334" font-size="22">0</text>
  <circle cx="490" cy="300" r="7" fill="#14578c"/>
  <text x="420" y="340" font-size="25"><tspan class="math">p</tspan> = P<tspan baseline-shift="sub" font-size="17">W</tspan>(<tspan class="math">x</tspan>)</text>
  <circle cx="490" cy="70" r="7" fill="#be2d37"/><text x="510" y="73" font-size="28" class="math">x</text>
  <line x1="130" y1="300" x2="482" y2="300" stroke="#14578c" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="270" y="284" font-size="24" fill="#14578c">P<tspan baseline-shift="sub" font-size="16">W</tspan>(<tspan class="math">x</tspan>)</text>
  <line x1="490" y1="293" x2="490" y2="78" stroke="#be2d37" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="515" y="190" font-size="25" fill="#be2d37"><tspan class="math">x − p</tspan> ∈ W<tspan baseline-shift="super" font-size="17">⊥</tspan></text>
  <line x1="130" y1="300" x2="490" y2="70" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="9 8"/>
  <path d="M490 270H520V300" fill="none" stroke="#17202a" stroke-width="3"/>
  <text x="535" y="278" font-size="25">90°</text>
  <rect x="65" y="370" width="770" height="58" rx="10" fill="#fff" stroke="#2a805c" stroke-width="2"/>
  <text x="450" y="408" text-anchor="middle" font-size="25"><tspan class="math">p</tspan> = P<tspan baseline-shift="sub" font-size="17">W</tspan>(<tspan class="math">x</tspan>)  ⇔  ⟨<tspan class="math">x − p</tspan>, <tspan class="math">w</tspan>⟩ = 0 para todo <tspan class="math">w</tspan> ∈ W</text>
</svg>
